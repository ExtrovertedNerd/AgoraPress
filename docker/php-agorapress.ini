; AgoraPress PHP overrides for the Docker development image.
; Keep aligned with SPEC performance / upload expectations (modest shared hosting).

memory_limit = 128M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
date.timezone = UTC

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
