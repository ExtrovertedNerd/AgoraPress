# AgoraPress Apache virtual host for Docker (dev).
# Enables .htaccess rewrites for pretty permalinks (SPEC §1 / §2).

ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny direct web access to sensitive paths if rewrite is bypassed.
    <FilesMatch "^(ap-config\.php|composer\.(json|lock)|\.env)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
