<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AP_Editor contrast fixture (dark, no Agora)</title>
  <!--
    Custom dark theme that only sets color-scheme + light page text.
    No Agora stylesheet, no core design tokens, no Agora body mode class.
    Theme `button { color: inherit }` is the bleach failure mode.
  -->
  <style>
    html, body {
      color-scheme: dark;
      background: #12141a;
      color: #e8eaed;
    }
    button { color: inherit; }
  </style>
  <link rel="stylesheet" href="../../../ap-includes/css/ap-editor.css">
</head>
<body>
  <form>
    <div class="ap-editor ap-editor--visual" data-ap-editor-wrap>
      <div class="ap-editor__toolbar" role="toolbar" aria-label="Formatting (Visual)">
        <button type="button" class="ap-editor__btn ap-editor__btn--weight">B</button>
        <button type="button" class="ap-editor__btn ap-editor__btn--em">I</button>
        <button type="button" class="ap-editor__btn">Link</button>
        <button type="button" class="ap-editor__btn ap-editor__btn--emoji">😀</button>
      </div>
      <div class="ap-editor__surface" data-ap-editor-surface>Hello</div>
    </div>
  </form>
</body>
</html>
