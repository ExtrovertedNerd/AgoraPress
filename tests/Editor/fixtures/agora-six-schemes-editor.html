<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agora six schemes × AP_Editor</title>
  <!--
    Visual check: each iframe is Agora + ap-editor.css for one of the six
    schemes. Do not load Addons themes (Jarvis, BlindVault, MensBS, …).
  -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    h1 { font-size: 1.1rem; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
      gap: 0.75rem;
    }
    iframe {
      width: 100%;
      height: 16rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Agora six schemes — editor contrast</h1>
  <p>
    Core <code>ap-editor.css</code> plus default Agora <code>style.css</code>.
    No Addons themes.
  </p>
  <div class="gallery">
    <iframe class="agora-scheme-marble" title="agora-scheme-marble" src="agora-scheme-editor.html?scheme=marble"></iframe>
    <iframe class="agora-scheme-parchment" title="agora-scheme-parchment" src="agora-scheme-editor.html?scheme=parchment"></iframe>
    <iframe class="agora-scheme-cloud" title="agora-scheme-cloud" src="agora-scheme-editor.html?scheme=cloud"></iframe>
    <iframe class="agora-scheme-obsidian" title="agora-scheme-obsidian" src="agora-scheme-editor.html?scheme=obsidian"></iframe>
    <iframe class="agora-scheme-midnight" title="agora-scheme-midnight" src="agora-scheme-editor.html?scheme=midnight"></iframe>
    <iframe class="agora-scheme-charcoal" title="agora-scheme-charcoal" src="agora-scheme-editor.html?scheme=charcoal"></iframe>
  </div>
</body>
</html>
