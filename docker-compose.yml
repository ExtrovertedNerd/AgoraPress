# AgoraPress local development stack (Phase 0).
#
# Usage:
#   docker-compose up -d --build
#   open http://localhost:8080
#
# Default DB credentials match AP_DB_* env vars (installer / ap-config later).
# Override ports and secrets via a local .env (gitignored) if needed.

name: agorapress

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: agorapress:dev
    ports:
      - "${AP_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      AP_DB_HOST: db
      AP_DB_NAME: ${AP_DB_NAME:-agorapress}
      AP_DB_USER: ${AP_DB_USER:-agorapress}
      AP_DB_PASSWORD: ${AP_DB_PASSWORD:-agorapress}
      AP_DB_CHARSET: utf8mb4
      AP_DB_COLLATE: utf8mb4_unicode_ci
      AP_TABLE_PREFIX: ${AP_TABLE_PREFIX:-ap_}
    restart: unless-stopped
    healthcheck:
      # 503 is expected before install (index.php "not installed" placeholder).
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/); echo $$code | grep -Eq '^(200|301|302|503)$$'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${AP_DB_NAME:-agorapress}
      MYSQL_USER: ${AP_DB_USER:-agorapress}
      MYSQL_PASSWORD: ${AP_DB_PASSWORD:-agorapress}
      MYSQL_ROOT_PASSWORD: ${AP_DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ap_db_data:/var/lib/mysql
    # Host 3307 by default so a local MySQL on 3306 does not conflict.
    ports:
      - "127.0.0.1:${AP_DB_PORT:-3307}:3306"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${AP_DB_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  ap_db_data:
