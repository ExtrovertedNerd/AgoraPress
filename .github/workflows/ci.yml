name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Hard-fail by default (global build conventions). No soft-fail without tracked debt.
jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl, fileinfo, zip, pdo, pdo_sqlite, pdo_mysql, gd, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPUnit
        run: composer test

      - name: Coding standards (PHPCS)
        run: composer cs:check

      - name: Static analysis (PHPStan)
        run: composer analyse
