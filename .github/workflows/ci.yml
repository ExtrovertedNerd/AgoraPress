name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Hard-fail by default (global build conventions). No soft-fail without tracked debt.
jobs:
  php:
    name: PHP ${{ matrix.php }}
    # Pinned. ubuntu-latest moves the runner image and its libzip.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@04c7ca5cdf3849c2db2777e8d3d97c6932b57601
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl, fileinfo, zip, pdo, pdo_sqlite, pdo_mysql, gd, intl
          coverage: none
          tools: composer:v2

      - name: Show tool versions
        run: |
          php -v
          php -r 'echo "libzip: " . phpversion("zip") . "\n";'
          python --version
          composer --version
          pytest --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPUnit
        run: composer test

      - name: Coding standards (PHPCS)
        run: composer cs:check

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: pytest (warn-only)
        run: pytest tests
        continue-on-error: true
